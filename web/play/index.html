<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- No pinch zoom; viewport-fit=cover lets the game run under the notch,
       and the safe-area padding below keeps it clear. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Plane Chaos</title>
  <!-- Home screen app: iOS takes the icon and full-screen launch from these. -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" href="/icons/favicon-32.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Plane Chaos">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#87bfeb">
  <style>
    :root {
      --sky: #87bfeb;
      --ink: #2b2840;
      --paper: #ffffff;
      --aisle: #c44848;
      --stripe: #f2b84b;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--sky);
      font-family: "Fredoka", system-ui, sans-serif;
      color: var(--ink);
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    /* Bevy sizes the canvas to fill this, inside the notch and home bar. */
    #game {
      position: fixed;
      inset: 0;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    #plane-chaos { display: block; outline: none; touch-action: none; }

    #loader {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: var(--sky);
      transition: opacity 0.4s;
    }
    #loader.done { opacity: 0; pointer-events: none; }
    .card {
      width: min(360px, calc(100vw - 32px));
      padding: 24px;
      background: var(--paper);
      border: 4px solid var(--ink);
      border-radius: 20px;
      box-shadow: 0 6px 0 var(--ink);
      text-align: center;
    }
    .card img { height: 120px; }
    .card h1 { margin: 8px 0 16px; font-size: 24px; }
    .bar {
      height: 20px;
      border: 3px solid var(--ink);
      border-radius: 10px;
      overflow: hidden;
      background: #e3e6ee;
    }
    .bar div {
      height: 100%;
      width: 0;
      background: repeating-linear-gradient(-45deg, var(--aisle) 0 12px, #d45a5a 12px 24px);
      transition: width 0.2s;
    }
    #status { margin: 12px 0 0; font-size: 14px; }
    #status.error { color: var(--aisle); font-weight: 600; }
    #back {
      position: fixed;
      top: calc(12px + env(safe-area-inset-top));
      left: calc(12px + env(safe-area-inset-left));
      padding: 6px 12px;
      border: 3px solid var(--ink);
      border-radius: 12px;
      background: var(--paper);
      color: var(--ink);
      font-weight: 600;
      font-size: 14px;
      text-decoration: none;
      opacity: 0.6;
    }
    #back:hover { opacity: 1; }

    /* Phones held upright: the cabin would be a thin strip, so ask to rotate. */
    #rotate {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      padding: 16px;
      background: var(--sky);
      text-align: center;
    }
    #rotate svg { width: 96px; height: 96px; animation: tilt 2s ease-in-out infinite; }
    #rotate p { margin: 16px 0 0; font-size: 20px; font-weight: 600; }
    @keyframes tilt { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
    @media (orientation: portrait) and (pointer: coarse) and (max-width: 600px) {
      #rotate { display: grid; }
    }

    /* "Add to Home Screen" hint, shown in Safari on iPhone and iPad. */
    #install {
      position: fixed;
      left: 50%;
      top: calc(12px + env(safe-area-inset-top));
      transform: translateX(-50%);
      display: none;
      align-items: center;
      gap: 10px;
      width: max-content;
      max-width: calc(100vw - 32px);
      padding: 8px 8px 8px 14px;
      border: 3px solid var(--ink);
      border-radius: 14px;
      background: var(--paper);
      box-shadow: 0 4px 0 var(--ink);
      font-size: 14px;
      line-height: 1.3;
    }
    #install.show, #update.show { display: flex; }

    /* A new version was stored for offline play and can be switched to. */
    #update {
      position: fixed;
      left: 50%;
      top: calc(12px + env(safe-area-inset-top));
      transform: translateX(-50%);
      display: none;
      align-items: center;
      gap: 10px;
      width: max-content;
      max-width: calc(100vw - 32px);
      padding: 8px 8px 8px 14px;
      border: 3px solid var(--ink);
      border-radius: 14px;
      background: var(--stripe);
      box-shadow: 0 4px 0 var(--ink);
      font-size: 14px;
    }
    #update button {
      padding: 6px 12px;
      border: 3px solid var(--ink);
      border-radius: 10px;
      background: var(--paper);
      color: var(--ink);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    #install svg { width: 18px; height: 18px; vertical-align: -3px; }
    #install button {
      flex: none;
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: 8px;
      background: #e3e6ee;
      color: var(--ink);
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="game"><canvas id="plane-chaos" tabindex="0"></canvas></div>

  <div id="loader">
    <div class="card">
      <img src="assets/flight_attendant_tray_front.png" alt="">
      <h1>Boarding…</h1>
      <div class="bar"><div id="progress"></div></div>
      <p id="status">Loading the game</p>
    </div>
  </div>

  <a id="back" href="/">← Back</a>

  <div id="install" role="status">
    <span>
      Install: tap
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Share"><path d="M12 3v12M8 7l4-4 4 4M7 11H5v10h14V11h-2"/></svg>
      then <b>Add to Home Screen</b>
    </span>
    <button type="button" aria-label="Dismiss">×</button>
  </div>

  <div id="update" role="status">
    <span>A new version of the game is ready.</span>
    <button type="button">Update</button>
  </div>

  <div id="rotate">
    <div>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M11 18.5h2"/></svg>
      <p>Turn your phone sideways to play</p>
    </div>
  </div>

  <script type="module">
    import init from "./plane_chaos.js";

    // Uncompressed size of plane_chaos_bg.wasm, filled in by the Docker build.
    const WASM_SIZE = Number("__WASM_SIZE__") || 0;
    const progress = document.getElementById("progress");
    const status = document.getElementById("status");

    // Suggests "Add to Home Screen" on iPhone and iPad, unless the game already
    // runs from the home screen or the player dismissed the hint before.
    function showInstallHint() {
      const ios = /iPhone|iPad|iPod/.test(navigator.userAgent)
        || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      const installed = navigator.standalone === true
        || matchMedia("(display-mode: standalone), (display-mode: fullscreen)").matches;
      let dismissed = false;
      try { dismissed = localStorage.getItem("install-hint-dismissed") === "1"; } catch {}
      if (!ios || installed || dismissed) return;

      const hint = document.getElementById("install");
      const hide = () => hint.classList.remove("show");
      hint.querySelector("button").addEventListener("click", () => {
        hide();
        try { localStorage.setItem("install-hint-dismissed", "1"); } catch {}
      });
      hint.classList.add("show");
      setTimeout(hide, 15000);
    }

    // Stores the game for offline play (sw.js). When a newer version has been
    // stored, offers to restart into it instead of swapping it in mid-game.
    async function registerServiceWorker() {
      if (!("serviceWorker" in navigator)) return;
      const registration = await navigator.serviceWorker.register("sw.js");
      const banner = document.getElementById("update");
      const offerUpdate = () => {
        if (registration.waiting && navigator.serviceWorker.controller) banner.classList.add("show");
      };
      let updating = false;
      banner.querySelector("button").addEventListener("click", () => {
        updating = true;
        registration.waiting?.postMessage("skip-waiting");
      });
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (updating) location.reload();
      });
      registration.addEventListener("updatefound", () => {
        registration.installing?.addEventListener("statechange", offerUpdate);
      });
      offerUpdate();
      // A home screen app is resumed rather than reloaded, so look for a new
      // version whenever it comes back to the foreground.
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") registration.update().catch(() => {});
      });
    }

    function fail(message) {
      status.textContent = message;
      status.classList.add("error");
    }

    // Fetches the wasm while counting bytes, so the loading bar can move.
    async function fetchWasm(url) {
      const response = await fetch(url);
      if (!response.ok) throw new Error(`${url}: ${response.status}`);
      if (!response.body || !WASM_SIZE) return response;

      const reader = response.body.getReader();
      const chunks = [];
      let loaded = 0;
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
        loaded += value.length;
        progress.style.width = `${Math.min(100, (loaded / WASM_SIZE) * 100)}%`;
        status.textContent = `Loading the game (${(loaded / 1e6).toFixed(1)} MB)`;
      }
      return new Response(new Blob(chunks), { headers: { "Content-Type": "application/wasm" } });
    }

    if (!document.createElement("canvas").getContext("webgl2")) {
      fail("Your browser doesn't support WebGL 2, which the game needs. Try a recent Chrome, Firefox or Safari.");
    } else {
      try {
        const wasm = await fetchWasm(new URL("plane_chaos_bg.wasm", import.meta.url));
        progress.style.width = "100%";
        status.textContent = "Taking off";
        try {
          await init({ module_or_path: wasm });
        } catch (e) {
          // winit leaves the start-up function by throwing; the game keeps running.
          if (!String(e).includes("Using exceptions for control flow")) throw e;
        }
        document.getElementById("loader").classList.add("done");
        document.getElementById("plane-chaos").focus();
        showInstallHint();
        registerServiceWorker().catch((e) => console.warn("offline play unavailable:", e));
      } catch (e) {
        console.error(e);
        fail(navigator.onLine
          ? "Something went wrong while loading the game. Reloading the page usually helps."
          : "You're offline. Open the game once with a connection, then it works offline too.");
      }
    }
  </script>
</body>
</html>
